name: CI

on:
  push:
    branches: [main]
  pull_request:

# Read-only token: this workflow builds and tests, it never writes to the repository.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Real backends for the integration tests, which skip rather than fail when these are absent.
    # Images pinned by digest, like the Dockerfile.
    services:
      dynamodb-local:
        # The image's default command runs in memory. Without -sharedDb it keeps one database per
        # access key and region; the app and the test fixtures use the same ones.
        image: amazon/dynamodb-local:3.3.1@sha256:ff89bd48ff32cd8d9be5fee8873b65b8854dc408f1afe881be6eb00247bc0dab
        ports:
          - 8000:8000
      cassandra:
        # Stands in for Amazon Keyspaces: same CQL protocol, no SigV4/TLS (see the test config).
        image: cassandra:5.0.9@sha256:8819d1b7877ee6621751a761cc163332e9c3eaf671c8ef672f7c77a7c5bff05f
        ports:
          - 9042:9042
        env:
          MAX_HEAP_SIZE: 512M
          HEAP_NEWSIZE: 128M
        options: >-
          --health-cmd "cqlsh -e 'describe keyspaces'"
          --health-interval 10s
          --health-timeout 10s
          --health-retries 20
    steps:
      # Third-party actions are pinned to commit SHAs; a tag can be moved to different code.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: corretto
          java-version: '21'
          cache: maven
      - name: Build and test
        run: mvn -B verify
      - name: Fail if the integration tests were skipped
        # They skip when a backend is unreachable; in CI that would hide a broken service.
        run: |
          for suite in QueryDDBTest QueryDDBDuckDbTest QueryCassandraTest; do
            report="query-app/target/surefire-reports/TEST-${suite}.xml"
            test -f "$report" || { echo "::error::$suite did not run"; exit 1; }
            if grep -q 'skipped="[1-9]' "$report"; then echo "::error::$suite was skipped"; exit 1; fi
          done

  locust-harness:
    name: Load-test harness stays runnable
    # The previous harness rotted invisibly for years (it targeted an API removed in Locust
    # 1.0). This proves the locustfile imports and its tasks register under the pinned version.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Validate locustfile and seeder
        working-directory: query-app/src/test/locust/ddb
        run: |
          pip3 install -q -r requirements.txt
          AQP_SECRET=ci-smoke locust -f performance_test_aqp.py --list
          python3 seed_table.py --help > /dev/null
          python3 seed_table.py --rows-per-partition 100 --print-expected

  image:
    name: Build container image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      dynamodb-local:
        # Backend for the DuckDB-engine boot smoke below; same pinned image as the test job.
        image: amazon/dynamodb-local:3.3.1@sha256:ff89bd48ff32cd8d9be5fee8873b65b8854dc408f1afe881be6eb00247bc0dab
        ports:
          - 8000:8000
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: build-script/Dockerfile
          push: false
          load: true
          tags: simple-aggregation-query-app:ci
      - name: Check the image runs as non-root and has its tools
        run: |
          test "$(docker image inspect --format '{{.Config.User}}' simple-aggregation-query-app:ci)" = "10001:10001"
          # The HEALTHCHECK relies on bash's /dev/tcp.
          docker run --rm --entrypoint bash simple-aggregation-query-app:ci -c 'echo bash ok'
      - name: Check the application refuses to start without its secret
        run: |
          if docker run --rm simple-aggregation-query-app:ci > out.log 2>&1; then
            echo "::error::started without AQP_REPORTING_APP_SECRET"; exit 1
          fi
          grep -q "AQP_REPORTING_APP_SECRET" out.log
      - name: Boot smoke with the DuckDB engine
        # Startup implies the engine probe passed: the DuckDB native library loaded and ran a
        # query inside the hardened container (uid 10001, JAVA_TOOL_OPTIONS native-access flag).
        run: |
          sed 's/^localDDB: false/localDDB: true/' query-app/conf/keyspaces-aggregation-query-proxy.yaml > /tmp/smoke.yaml
          docker run -d --name smoke --network host \
            -v /tmp/smoke.yaml:/usr/app/keyspaces-aggregation-query-proxy.yaml:ro \
            -e AQP_SERVICE_NAME=DYNAMODB -e AQP_AGGREGATION_ENGINE=DUCKDB \
            -e AQP_REPORTING_APP_SECRET=ci-smoke-secret-0123456789 \
            simple-aggregation-query-app:ci
          for i in $(seq 1 60); do
            curl -sf -o /dev/null http://127.0.0.1:8081/healthcheck && break; sleep 2
          done
          curl -sf -o /dev/null http://127.0.0.1:8081/healthcheck || { docker logs smoke; echo "::error::container never became healthy"; exit 1; }
          docker logs smoke 2>&1 | grep -q "Aggregation engine: DUCKDB" || { echo "::error::engine log line missing"; exit 1; }
          export AWS_ACCESS_KEY_ID=AKIAIOSFODNN7EXAMPLE AWS_SECRET_ACCESS_KEY=wJalrXUtnFEMI/K7MDENG/bPxRfiCYEXAMPLEKEY AWS_REGION=us-east-1
          aws dynamodb create-table --endpoint-url http://127.0.0.1:8000 --table-name smoke \
            --attribute-definitions AttributeName=pk,AttributeType=S \
            --key-schema AttributeName=pk,KeyType=HASH --billing-mode PAY_PER_REQUEST > /dev/null
          aws dynamodb execute-statement --endpoint-url http://127.0.0.1:8000 \
            --statement "INSERT INTO smoke VALUE {'pk':'a','n':2}" > /dev/null
          aws dynamodb execute-statement --endpoint-url http://127.0.0.1:8000 \
            --statement "INSERT INTO smoke VALUE {'pk':'b','n':3}" > /dev/null
          body=$(curl -sf -u reporting-app:ci-smoke-secret-0123456789 -H 'Content-Type: application/json' \
            -d '{"query":"select sum(n) as s FROM smoke"}' http://127.0.0.1:8080/query-aggregation)
          echo "$body" | grep -q '"s":5' || { echo "::error::wrong answer from the DuckDB engine: $body"; exit 1; }
          docker rm -f smoke
