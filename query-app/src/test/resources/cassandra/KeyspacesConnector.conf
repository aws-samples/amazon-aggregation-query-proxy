# Driver configuration for QueryCassandraTest: a local Apache Cassandra standing in for Amazon
# Keyspaces. Same CQL protocol; no SigV4 or TLS, which a local node does not offer.
datastax-java-driver {
  basic {
    contact-points = ["127.0.0.1:9042"]
    load-balancing-policy.local-datacenter = datacenter1
    request {
      # Deliberately tiny, so every test query spans many pages and exercises the async paging.
      page-size = 50
      timeout = 10 seconds
      consistency = LOCAL_ONE
    }
  }
  advanced.connection.init-query-timeout = 10 seconds
}
