# DataStax Java driver configuration for Amazon Keyspaces.
#
# Contains no secrets. Authentication uses SigV4 with the AWS default credential chain (task
# role, instance profile, AWS_* environment variables, ~/.aws), so nothing sensitive needs to be
# in this file or in the container image.

# Region of the Keyspaces endpoint. Overridden by the AWS_REGION environment variable if set.
aqp.region = "us-east-1"
aqp.region = ${?AWS_REGION}

datastax-java-driver {
basic {
  load-balancing-policy {
    local-datacenter = ${aqp.region}
        }
  contact-points = [
            "cassandra."${aqp.region}".amazonaws.com:9142"
        ]
  request {
   page-size = 3500
   timeout = 10 seconds
   consistency = LOCAL_ONE
        }
    }
advanced {
 control-connection {
  timeout = 10 seconds
        }
 connection {
 max-requests-per-connection = 3000
   pool {
     local.size = 9
   }
  connect-timeout = 10 seconds
  init-query-timeout = 10 seconds
  warn-on-init-error = false
        }
 # Previously PlainTextAuthProvider with the password written in this file, which build.sh then
 # copied into the Docker image. If you must use Keyspaces service-specific credentials instead,
 # inject them from the environment rather than writing them here:
 #   class = PlainTextAuthProvider
 #   username = ${KEYSPACES_USERNAME}
 #   password = ${KEYSPACES_PASSWORD}
 auth-provider {
  class = software.aws.mcs.auth.SigV4AuthProvider
  aws-region = ${aqp.region}
        }
 # Hostname validation was disabled, which let any certificate from a trusted CA impersonate
 # the Keyspaces endpoint. Keyspaces presents certificates that validate against the JDK's
 # default trust store, so no custom trust store is needed.
 ssl-engine-factory {
  class = DefaultSslEngineFactory
  hostname-validation = true
        }
    }
}
