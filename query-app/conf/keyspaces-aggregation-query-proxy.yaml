# Aggregation Query Proxy configuration.
#
# Contains no secrets: dollar-brace placeholders below are read from the environment at startup,
# and startup fails if a referenced variable is not set (":-" introduces a default).
#
# Do not write a dollar-brace placeholder in a comment: substitution runs over the whole file,
# comments included, so an unset one fails startup.

# KEYSPACES or DYNAMODB
serviceName: ${AQP_SERVICE_NAME:-KEYSPACES}
# Directory containing KeyspacesConnector.conf (Keyspaces only). /usr/app in the container.
pathToKeyspacesConfigFile: ${AQP_KEYSPACES_CONFIG_DIR:-/usr/app}
awsRegion: ${AWS_REGION:-us-east-1}
localDDB: false

# Engine evaluating the aggregation half of each query over the fetched rows.
# Valid values: PARTIQL (default), DUCKDB.
aggregationEngine: ${AQP_AGGREGATION_ENGINE:-PARTIQL}

# Push-down result budget; see "Limitations" in the README.
maxRows: 100000
maxResultBytes: 67108864

# Time budget for one query's data-store read (all pages) before a 504; aggregation time is
# additional. On ECS/Fargate keep this well under the task's stopTimeout (120s max there) so
# deployments don't cut in-flight queries.
queryTimeoutSeconds: ${AQP_QUERY_TIMEOUT_SECONDS:-360}

# DynamoDB only, optional: health-check this table with DescribeTable instead of the
# account-wide ListTables, so the task role can be scoped to specific tables.
dynamoHealthCheckTable: ${AQP_DDB_HEALTHCHECK_TABLE:-}

# One entry per API client, each with its own secret (16+ characters) and roles.
users:
  reporting-app:
    secret: ${AQP_REPORTING_APP_SECRET}
    roles: [SMALL_QUERY]

server:
  applicationConnectors:
    - type: http
      port: 8080
  # The admin port serves health checks, metrics, thread dumps and tasks such as changing log
  # levels, with no authentication. Bound to loopback so it is reachable only from inside the
  # host or container (the Docker HEALTHCHECK uses it). It previously listened on all interfaces.
  adminConnectors:
    - type: http
      bindHost: 127.0.0.1
      port: 8081

logging:
  # OFF, ERROR, WARN, INFO, DEBUG, TRACE or ALL. At DEBUG the extractors log each push-down
  # statement including its literal predicate values, which are often customer identifiers, so
  # enable it only while diagnosing a problem.
  level: INFO
  appenders:
    - type: console
      # requestId matches the X-Request-Id response header, so a caller's report can be traced
      # to the log lines of that one request.
      logFormat: "%-5p [%d{ISO8601,UTC}] [%X{requestId}] %c: %m%n%rEx"
